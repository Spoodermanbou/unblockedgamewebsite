<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BuildNow GG</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- Loads BuildNow GG via Google OpenSocial + jsDelivr CDN to bypass school filters -->
    <iframe 
        id="game-frame"
        src="https://images-opensocial.googleusercontent.com/gadgets/ifr?url=https://cdn.jsdelivr.net/gh/zhit73/mr1@main/bgg.xml" 
        allow="autoplay; fullscreen; pointer-lock" 
        allowfullscreen="true">
    </iframe>
    <script>
        window.onload = () => {
            document.getElementById('game-frame').focus();
        };
    </script>
</body>
</html>
