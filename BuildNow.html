<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <!-- Tells Unity where to find StreamingAssets and config files -->
    <base href="https://cdn.jsdelivr.net/gh/bubblfan/cg-rip@main/buildnow-gg/">
    <title>BuildNow GG</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d12;
            font-family: sans-serif;
        }
        #unity-canvas {
            width: 100vw;
            height: 100vh;
            background: #000;
            display: block;
        }
        #loader-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 320px;
            pointer-events: none;
        }
        #status-text {
            color: #00ff88;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        .bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        #bar-fill {
            width: 0%;
            height: 100%;
            background: #00ff88;
            transition: width 0.15s ease;
        }
    </style>

    <!-- CRAZYGAMES SDK BYPASS: Tricks BuildNow into skipping the post-splash "Loading..." check -->
    <script>
        const dummyCallback = (cb) => { if (typeof cb === "function") cb(null, {}); };
        window.CrazyGames = {
            SDK: {
                init: () => Promise.resolve(),
                environment: "local",
                ad: {
                    requestAd: (type, callbacks) => {
                        if (callbacks && callbacks.adFinished) callbacks.adFinished();
                        return Promise.resolve();
                    },
                    hasAdblock: (cb) => {
                        if (typeof cb === "function") cb(null, false);
                        return Promise.resolve(false);
                    }
                },
                game: {
                    sdkGameLoadingStart: () => {},
                    sdkGameLoadingStop: () => {},
                    gameplayStart: () => {},
                    gameplayStop: () => {},
                    happytime: () => {},
                    inviteLink: () => Promise.resolve("")
                },
                user: {
                    isUserAccountAvailable: false,
                    getUser: (cb) => {
                        if (typeof cb === "function") cb(null, null);
                        return Promise.resolve(null);
                    },
                    getUserToken: (cb) => {
                        if (typeof cb === "function") cb(null, "");
                        return Promise.resolve("");
                    },
                    addAuthListener: () => {}
                },
                data: {
                    getItem: (k) => localStorage.getItem(k),
                    setItem: (k, v) => localStorage.setItem(k, v),
                    removeItem: (k) => localStorage.removeItem(k),
                    clear: () => {}
                },
                banner: {
                    requestBanner: () => Promise.resolve(),
                    requestResponsiveBanner: () => Promise.resolve(),
                    clearBanner: () => {},
                    clearAllBanners: () => {}
                }
            }
        };
        window.CrazySDK = window.CrazyGames.SDK;
    </script>
</head>
<body>
    <div id="loader-ui">
        <div id="status-text">INITIALIZING LOCAL ENGINE...</div>
        <div class="bar-bg"><div id="bar-fill"></div></div>
    </div>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <script>
        const statusText = document.getElementById("status-text");
        const barFill = document.getElementById("bar-fill");
        const loaderUi = document.getElementById("loader-ui");
        const canvas = document.getElementById("unity-canvas");

        const cdnBase = "https://cdn.jsdelivr.net/gh/bubblfan/cg-rip@main/buildnow-gg/";
        const buildBase = cdnBase + "Build/";

        async function assembleBinary(fileName, label, startPct, endPct) {
            const chunks = [];
            let part = 1;
            while (part <= 30) {
                const batch = [];
                for (let i = 0; i < 4; i++) {
                    const p = part + i;
                    batch.push(
                        fetch(buildBase + fileName + ".part" + p)
                            .then(r => (r.ok ? r.arrayBuffer() : null))
                            .catch(() => null)
                    );
                }
                const results = await Promise.all(batch);
                let done = false;
                for (const buf of results) {
                    if (buf) {
                        chunks.push(buf);
                    } else {
                        done = true;
                        break;
                    }
                }
                const pct = Math.min(endPct, startPct + Math.round((part / 10) * (endPct - startPct)));
                statusText.innerText = `${label} (${chunks.length} CHUNKS)...`;
                barFill.style.width = pct + "%";
                if (done) break;
                part += 4;
            }
            if (chunks.length === 0) throw new Error("Could not fetch " + fileName);
            return new Blob(chunks, { type: "application/octet-stream" });
        }

        async function startLocalEngine() {
            try {
                const wasmBlob = await assembleBinary("7db022abd161455e3cc5f207e75d294b.wasm", "LOADING WASM ENGINE", 5, 45);
                const dataBlob = await assembleBinary("ab8dd356a41a2943639294657a0990f8.data", "LOADING 3D ASSETS", 45, 85);

                const wasmBlobUrl = URL.createObjectURL(wasmBlob);
                const dataBlobUrl = URL.createObjectURL(dataBlob);

                const origFetch = window.fetch;
                window.fetch = function(input, init) {
                    if (typeof input === "string") {
                        if (input.includes("7db022abd161455e3cc5f207e75d294b.wasm")) return origFetch(wasmBlobUrl, init);
                        if (input.includes("ab8dd356a41a2943639294657a0990f8.data")) return origFetch(dataBlobUrl, init);
                    }
                    return origFetch(input, init);
                };

                const origOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                    if (typeof url === "string") {
                        if (url.includes("7db022abd161455e3cc5f207e75d294b.wasm")) url = wasmBlobUrl;
                        if (url.includes("ab8dd356a41a2943639294657a0990f8.data")) url = dataBlobUrl;
                    }
                    return origOpen.call(this, method, url, ...rest);
                };

                const config = {
                    dataUrl: dataBlobUrl,
                    frameworkUrl: buildBase + "91a2bfcec140bc524100478b99a4f6d7.framework.js",
                    codeUrl: wasmBlobUrl,
                    streamingAssetsUrl: cdnBase + "StreamingAssets",
                    companyName: "BattleLab",
                    productName: "BuildNow GG",
                    productVersion: "1.0.0"
                };

                const script = document.createElement("script");
                script.src = buildBase + "7a2dbded24d57e056180125b1583e7c4.loader.js";
                script.onload = () => {
                    createUnityInstance(canvas, config, (progress) => {
                        const totalPct = 85 + Math.round(progress * 15);
                        statusText.innerText = "STARTING ENGINE... " + Math.round(progress * 100) + "%";
                        barFill.style.width = totalPct + "%";
                    }).then((instance) => {
                        window.unityInstance = instance;
                        loaderUi.style.display = "none";
                        canvas.focus();
                    });
                };
                document.body.appendChild(script);
            } catch (err) {
                statusText.innerText = "LOAD ERROR: " + err.message;
            }
        }

        startLocalEngine();
    </script>
</body>
</html>
