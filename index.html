    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0b0c;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* --- Floating Top Pill Navbar --- */
        .top-pill {
            margin-top: 18px;
            width: 480px;
            max-width: 92vw;
            height: 54px;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 100;
            transition: all 0.25s ease;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
            color: #00ff88;
        }

        .brand-logo span.mascot {
            font-size: 24px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.4));
            transition: transform 0.2s;
        }

        .brand-logo:hover span.mascot {
            transform: scale(1.15) rotate(-8deg);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #b0b0b8;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
        }

        .icon-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
        }

        /* --- Boot Splash Loader (4 Glowing Dots) --- */
        #boot-screen {
            position: absolute;
            inset: 0;
            background: #0b0b0c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: opacity 0.4s ease;
        }

        .dots-spinner {
            position: relative;
            width: 90px;
            height: 90px;
            animation: spinSlow 2.6s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dot {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .dot.red-top {
            top: 4px;
            left: 37px;
            background: #ff1e1e;
            box-shadow: 0 0 18px 4px rgba(255, 30, 30, 0.85);
        }

        .dot.red-bottom {
            bottom: 4px;
            left: 37px;
            background: #ff1e1e;
            box-shadow: 0 0 18px 4px rgba(255, 30, 30, 0.85);
        }

        .dot.green-left {
            top: 37px;
            left: 4px;
            background: #00ff44;
            box-shadow: 0 0 18px 4px rgba(0, 255, 68, 0.85);
        }

        .dot.green-right {
            top: 37px;
            right: 4px;
            background: #00ff44;
            box-shadow: 0 0 18px 4px rgba(0, 255, 68, 0.85);
        }

        .boot-date {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        .boot-counter {
            position: absolute;
            bottom: 110px;
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        /* --- Main Workspace & Search --- */
        .workspace {
            flex: 1;
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 30px;
            overflow-y: auto;
            z-index: 10;
        }

        .search-wrap {
            width: 100%;
            max-width: 420px;
            margin-bottom: 28px;
        }

        .search-input {
            width: 100%;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 12px 18px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            text-align: center;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.15);
        }

        /* --- App & Game Grid --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .item-card {
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 22px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.22s ease;
        }

        .item-card:hover {
            background: #1c1c21;
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
        }

        .item-card img {
            width: 68px;
            height: 68px;
            border-radius: 14px;
            object-fit: cover;
            margin-bottom: 12px;
            transition: transform 0.22s ease;
        }

        .item-card:hover img {
            transform: scale(1.08);
        }

        .item-card span {
            font-size: 14px;
            font-weight: 700;
            color: #e4e4e7;
            letter-spacing: 0.4px;
        }

        /* --- Floating Bottom Pill Bar --- */
        .bottom-pill {
            margin-bottom: 16px;
            width: 480px;
            max-width: 92vw;
            height: 48px;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .online-status {
            font-size: 13px;
            font-weight: 700;
            color: #d4d4d8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff44;
            box-shadow: 0 0 8px #00ff44;
        }

        /* --- Fullscreen Game / App Viewer --- */
        #app-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            flex-direction: column;
        }

        .viewer-bar {
            height: 44px;
            background: #121215;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
        }

        .ctrl-btn {
            background: #1f1f24;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .ctrl-btn:hover {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        body.theater-active .viewer-bar {
            display: none !important;
        }

        #floating-back-btn {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 9999;
            background: rgba(21, 21, 24, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.2s;
        }

        #floating-back-btn:hover {
            opacity: 1;
            background: #00ff88;
            color: #000;
        }

        body.theater-active #floating-back-btn {
            display: block;
        }
    </style>
</head>

        let loadedCount = 0;
        const totalToLoad = 674;
        const counterEl = document.getElementById('load-counter');
        const bootScreen = document.getElementById('boot-screen');

        const bootInterval = setInterval(() => {
            loadedCount += Math.floor(Math.random() * 95) + 45;
            if (loadedCount >= totalToLoad) {
                loadedCount = totalToLoad;
                counterEl.innerText = `${loadedCount}/${totalToLoad} loaded...`;
                clearInterval(bootInterval);
                setTimeout(() => {
                    bootScreen.style.opacity = '0';
                    setTimeout(() => bootScreen.style.display = 'none', 400);
                }, 250);
            } else {
                counterEl.innerText = `${loadedCount}/${totalToLoad} loaded...`;
            }
        }, 80);

        // 2. Fluctuating Online Users Counter
        setInterval(() => {
            const base = 680;
            const diff = Math.floor(Math.random() * 25) - 10;
            document.getElementById('online-count').innerText = `online users: ${base + diff}`;
        }, 5000);

        // 3. Category Switching
        function switchCategory(category) {
            currentCategory = category;
            if (document.getElementById('app-viewer').style.display === 'flex') {
                closeApp();
            }
            document.getElementById('btn-games').classList.toggle('active', category === 'games');
            document.getElementById('btn-apps').classList.toggle('active', category === 'apps');
            filterItems();
        }

        function filterItems() {
            const q = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.item-card').forEach(card => {
                const matchCat = card.getAttribute('data-category') === currentCategory;
                const matchText = card.querySelector('span').innerText.toLowerCase().includes(q);
                card.style.display = (matchCat && matchText) ? 'flex' : 'none';
            });
        }

            if (document.activeElement) document.activeElement.blur();
            document.getElementById('app-viewer').style.display = 'flex';
            iframe.removeAttribute('srcdoc');
            const sep = url.includes('?') ? '&' : '?';
            iframe.src = url + sep + 'nocache=' + Date.now();
        }

            <video id="tt-video" playsinline autoplay loop></video>
            
            <div class="vid-overlay">
                <div class="author" id="tt-author">@creator</div>
                <div class="desc" id="tt-desc">Loading video description...</div>
            </div>

            <div class="side-actions">
                <div class="act-item" onclick="this.querySelector('.act-circle').style.background='#ff0050'">
                    <div class="act-circle">❤️</div>
                    <div class="act-count" id="tt-likes">0</div>
                </div>
                <div class="act-item">
                    <div class="act-circle">💬</div>
                    <div class="act-count" id="tt-comments">0</div>
                </div>
                <div class="act-item" onclick="nextVid()">
                    <div class="act-circle">⏭️</div>
                    <div class="act-count">Next</div>
                </div>
            </div>
        </div>

        <div class="nav-arrows">
            <button class="arrow-btn" title="Previous Video (Up Arrow)" onclick="prevVid()">▲</button>
            <button class="arrow-btn" title="Next Video (Down Arrow)" onclick="nextVid()">▼</button>
        </div>
    </div>

    <script>
        let videos = [];
        let currentIndex = 0;
        const vidEl = document.getElementById('tt-video');
        const statusEl = document.getElementById('tt-status');

        vidEl.addEventListener('click', () => {
            vidEl.paused ? vidEl.play() : vidEl.pause();
        });

        function formatNum(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num;
        }

        async function fetchFeed(keywords) {
            statusEl.style.display = 'block';
            statusEl.innerText = 'Loading "' + keywords + '" feed...';
            vidEl.style.opacity = '0.2';
            try {
                const res = await fetch('https://www.tikwm.com/api/feed/search?keywords=' + encodeURIComponent(keywords) + '&count=25');
                const json = await res.json();
                if (json && json.data && json.data.videos && json.data.videos.length > 0) {
                    videos = json.data.videos;
                    currentIndex = 0;
                    renderVideo(0);
                } else {
                    statusEl.innerText = 'No videos found. Try another search!';
                }
            } catch (err) {
                statusEl.innerText = 'Error connecting to feed API.';
            }
        }

        function renderVideo(idx) {
            if (!videos[idx]) return;
            const v = videos[idx];
            statusEl.style.display = 'none';
            vidEl.style.opacity = '1';
            vidEl.src = v.play;
            vidEl.play().catch(() => {});
            document.getElementById('tt-author').innerText = '@' + (v.author ? v.author.unique_id : 'user');
            document.getElementById('tt-desc').innerText = v.title || '';
            document.getElementById('tt-likes').innerText = formatNum(v.digg_count);
            document.getElementById('tt-comments').innerText = formatNum(v.comment_count);
        }

        function nextVid() {
            if (videos.length === 0) return;
            currentIndex = (currentIndex + 1) % videos.length;
            renderVideo(currentIndex);
        }

        function prevVid() {
            if (videos.length === 0) return;
            currentIndex = (currentIndex - 1 + videos.length) % videos.length;
            renderVideo(currentIndex);
        }

        function searchVideos() {
            const q = document.getElementById('tt-query').value.trim();
            if (q) fetchFeed(q);
        }

        function quickTag(tag, btn) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.getElementById('tt-query').value = tag;
            fetchFeed(tag);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') nextVid();
            if (e.key === 'ArrowUp') prevVid();
        });

        window.addEventListener('wheel', (e) => {
            if (window._wheelLock) return;
            window._wheelLock = true;
            if (e.deltaY > 25) nextVid();
            else if (e.deltaY < -25) prevVid();
            setTimeout(() => window._wheelLock = false, 450);
        });

        // Boot initial FYP feed
        fetchFeed('trending fyp gaming');
    <\/script>
</body>
</html>`;
        }

        // 6. ROBLOX CLOUD LAUNCHER
        function launchRobloxApp() {
            if (document.activeElement) document.activeElement.blur();
            document.getElementById('app-viewer').style.display = 'flex';
            iframe.src = "about:blank";
            iframe.srcdoc = `<!DOCTYPE html>

        .s-btn { background: #1f1f26; color: #00ff88; border: 1px solid #00ff88; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px; }

            document.querySelectorAll('.s-btn').forEach(x => x.classList.remove('active'));
            if (b) b.classList.add('active');

        function loadCust() {

            if (!v.startsWith('http')) v = 'https://' + v;

        }

        function promptCustomLink() {
            const url = prompt("Enter a local file name (e.g. ./BuildNow.html) or full https:// link:");
            if (url) openApp(url.trim());
        }

        iframe.addEventListener('load', () => {
            if ((iframe.src && iframe.src !== window.location.href) || iframe.srcdoc) {
                iframe.focus();
                if (iframe.contentWindow) iframe.contentWindow.focus();
            }
        });

        function closeApp() {
            document.body.classList.remove('theater-active');
            document.getElementById('app-viewer').style.display = 'none';
            iframe.removeAttribute('srcdoc');
            iframe.src = "";
        }

        function toggleTheaterMode() {
            document.body.classList.toggle('theater-active');
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) iframe.contentWindow.focus();
            }, 100);
        }

        async function goFullscreen() {
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                document.body.classList.add('theater-active');
                if (navigator.keyboard && navigator.keyboard.lock) {
                    await navigator.keyboard.lock(['Escape']);
                }
            } catch (e) {}
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) iframe.contentWindow.focus();
            }, 100);
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('theater-active');
                if (navigator.keyboard && navigator.keyboard.unlock) {
                    navigator.keyboard.unlock();
                }
            }
        });

        // 7. Tab Cloaking
        const favicon = document.getElementById("favicon");
        function cloakAsDocs() {
            document.title = "Google Docs";
            favicon.href = "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico";
        }
        function disguise() {
            document.title = "New Tab";
            favicon.href = "https://www.google.com/favicon.ico";
        }
        function restore() {
            document.title = "i-Ready";
            favicon.href = "https://login.i-ready.com/favicon.ico";
        }
        document.addEventListener("visibilitychange", () => { document.hidden ? disguise() : restore(); });
    </script>
</body>
