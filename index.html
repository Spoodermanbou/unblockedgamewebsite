<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>i-Ready</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://login.i-ready.com/favicon.ico">

    <!-- AUTO CACHE BUSTER: Forces Chrome to drop old versions automatically -->
    <script>
        const CURRENT_BUILD = "v302";
        if (window.location.search !== "?" + CURRENT_BUILD) {
            window.location.replace(window.location.pathname + "?" + CURRENT_BUILD);
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0b0c;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* --- Floating Top Pill Navbar --- */
        .top-pill {
            margin-top: 18px;
            width: 480px;
            max-width: 92vw;
            height: 54px;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 100;
            transition: all 0.25s ease;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
            color: #00ff88;
        }

        .brand-logo span.mascot {
            font-size: 24px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.4));
            transition: transform 0.2s;
        }

        .brand-logo:hover span.mascot {
            transform: scale(1.15) rotate(-8deg);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #b0b0b8;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
        }

        .icon-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
        }

        /* --- Boot Splash Loader (4 Glowing Dots) --- */
        #boot-screen {
            position: absolute;
            inset: 0;
            background: #0b0b0c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: opacity 0.4s ease;
        }

        .dots-spinner {
            position: relative;
            width: 90px;
            height: 90px;
            animation: spinSlow 2.6s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dot {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .dot.red-top {
            top: 4px;
            left: 37px;
            background: #ff1e1e;
            box-shadow: 0 0 18px 4px rgba(255, 30, 30, 0.85);
        }

        .dot.red-bottom {
            bottom: 4px;
            left: 37px;
            background: #ff1e1e;
            box-shadow: 0 0 18px 4px rgba(255, 30, 30, 0.85);
        }

        .dot.green-left {
            top: 37px;
            left: 4px;
            background: #00ff44;
            box-shadow: 0 0 18px 4px rgba(0, 255, 68, 0.85);
        }

        .dot.green-right {
            top: 37px;
            right: 4px;
            background: #00ff44;
            box-shadow: 0 0 18px 4px rgba(0, 255, 68, 0.85);
        }

        .boot-date {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        .boot-counter {
            position: absolute;
            bottom: 110px;
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        /* --- Main Workspace & Search --- */
        .workspace {
            flex: 1;
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 30px;
            overflow-y: auto;
            z-index: 10;
        }

        .search-wrap {
            width: 100%;
            max-width: 420px;
            margin-bottom: 28px;
        }

        .search-input {
            width: 100%;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 12px 18px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            text-align: center;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.15);
        }

        /* --- App & Game Grid --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .item-card {
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 22px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.22s ease;
        }

        .item-card:hover {
            background: #1c1c21;
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
        }

        .item-card img {
            width: 68px;
            height: 68px;
            border-radius: 14px;
            object-fit: cover;
            margin-bottom: 12px;
            transition: transform 0.22s ease;
        }

        .item-card:hover img {
            transform: scale(1.08);
        }

        .item-card span {
            font-size: 14px;
            font-weight: 700;
            color: #e4e4e7;
            letter-spacing: 0.4px;
        }

        /* --- Floating Bottom Pill Bar --- */
        .bottom-pill {
            margin-bottom: 16px;
            width: 480px;
            max-width: 92vw;
            height: 48px;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .online-status {
            font-size: 13px;
            font-weight: 700;
            color: #d4d4d8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff44;
            box-shadow: 0 0 8px #00ff44;
        }

        /* --- Fullscreen Game / App Viewer --- */
        #app-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            flex-direction: column;
        }

        .viewer-bar {
            height: 48px;
            background: #121215;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: #1f1f24;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .ctrl-btn:hover, .ctrl-btn.active {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        /* Proxy Bar for Real TikTok & Real Roblox */
        #proxy-bar {
            display: none;
            height: 46px;
            background: #16161d;
            border-bottom: 1px solid rgba(0, 255, 136, 0.25);
            align-items: center;
            gap: 8px;
            padding: 0 16px;
            font-size: 12px;
            color: #ccc;
            flex-shrink: 0;
            overflow-x: auto;
        }

        .popout-btn {
            background: #ff0050;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            margin-left: auto;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(255, 0, 80, 0.4);
        }

        .popout-btn:hover {
            background: #00f2fe;
            color: #000;
        }

        #main-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #0b0b0c;
        }

        body.theater-active .viewer-bar,
        body.theater-active #proxy-bar {
            display: none !important;
        }

        #floating-back-btn {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 9999;
            background: rgba(21, 21, 24, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.2s;
        }

        #floating-back-btn:hover {
            opacity: 1;
            background: #00ff88;
            color: #000;
        }

        body.theater-active #floating-back-btn {
            display: block;
        }
    </style>
</head>
<body>

    <div class="top-pill">

    <div id="boot-screen">

    <div class="workspace">

        </div>

            <!-- GAMES TAB -->
            <div class="item-card" data-category="games" onclick="openApp('./eaglercraft.html')">

                <span>Roblox</span>

    <!-- 4. BOTTOM FLOATING PILL BAR -->
    <div class="bottom-pill">
        <div class="online-status">
            <div class="online-dot"></div>
            <span id="online-count">online users: 688</span>

    <!-- 5. GAME & APP VIEWER OVERLAY -->
    <div id="app-viewer">
        <div class="viewer-bar">
            <button class="ctrl-btn" onclick="closeApp()">← Back</button>
            <button class="ctrl-btn" onclick="toggleTheaterMode()">[ ] Hide Bar (No Esc Bug)</button>
            <button class="ctrl-btn" onclick="goFullscreen()">⛶ Fullscreen (Lock Esc)</button>
        </div>

        <!-- Proxy Browser Bar for Real TikTok & Real Roblox -->
        <div id="proxy-bar">
            <span id="proxy-title" style="font-weight:700; color:#00ff88;">PROXIES:</span>
            <div id="proxy-btn-list" style="display:flex; gap:6px;"></div>
            <button class="popout-btn" id="direct-popout-btn">↗ Launch Real Website (Window Bypass)</button>
        </div>

        <iframe id="main-frame" src="" tabindex="0" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; keyboard-map; microphone; camera"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('main-frame');
        const proxyBar = document.getElementById('proxy-bar');
        const proxyBtnList = document.getElementById('proxy-btn-list');
        let currentCategory = 'games';

        // 1. Boot Loader Animation
        let loadedCount = 0;
        const totalToLoad = 674;
        const counterEl = document.getElementById('load-counter');
        const bootScreen = document.getElementById('boot-screen');

        const bootInterval = setInterval(() => {
            loadedCount += Math.floor(Math.random() * 95) + 45;
            if (loadedCount >= totalToLoad) {
                loadedCount = totalToLoad;
                counterEl.innerText = `${loadedCount}/${totalToLoad} loaded...`;
                clearInterval(bootInterval);
                setTimeout(() => {
                    bootScreen.style.opacity = '0';
                    setTimeout(() => bootScreen.style.display = 'none', 400);
                }, 250);
            } else {
                counterEl.innerText = `${loadedCount}/${totalToLoad} loaded...`;
            }
        }, 80);

        // 2. Fluctuating Online Users Counter
        setInterval(() => {
            const base = 680;
            const diff = Math.floor(Math.random() * 25) - 10;
            document.getElementById('online-count').innerText = `online users: ${base + diff}`;
        }, 5000);

        // 3. Category Switching
        function switchCategory(category) {
            currentCategory = category;
            if (document.getElementById('app-viewer').style.display === 'flex') {
                closeApp();
            }
            document.getElementById('btn-games').classList.toggle('active', category === 'games');
            document.getElementById('btn-apps').classList.toggle('active', category === 'apps');
            filterItems();
        }

        function filterItems() {
            const q = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.item-card').forEach(card => {
                const matchCat = card.getAttribute('data-category') === currentCategory;
                const matchText = card.querySelector('span').innerText.toLowerCase().includes(q);
                card.style.display = (matchCat && matchText) ? 'flex' : 'none';
            });
        }

        // 4. Local HTML Game Opener (Eagler & BuildNow)
        function openApp(url) {
            if (document.activeElement) document.activeElement.blur();
            proxyBar.style.display = 'none';
            document.getElementById('app-viewer').style.display = 'flex';
            const sep = url.includes('?') ? '&' : '?';
            iframe.src = url + sep + 'nocache=' + Date.now();
        }

        // 5. Real TikTok & Real Roblox Proxy Browser + Direct Window Launcher
        function openProxyApp(title, proxies, realSiteUrl) {
            if (document.activeElement) document.activeElement.blur();
            document.getElementById('proxy-title').innerText = title;
            proxyBtnList.innerHTML = '';

            proxies.forEach((p, idx) => {
                const b = document.createElement('button');
                b.className = 'ctrl-btn' + (idx === 0 ? ' active' : '');
                b.innerText = p.name;
                b.onclick = () => {
                    proxyBtnList.querySelectorAll('.ctrl-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    iframe.src = p.url;
                };
                proxyBtnList.appendChild(b);
            });

            const popBtn = document.getElementById('direct-popout-btn');
            popBtn.onclick = () => {
                window.open(realSiteUrl, '_blank', 'width=1150,height=780,menubar=no,toolbar=no,location=no');
            };

            proxyBar.style.display = 'flex';
            document.getElementById('app-viewer').style.display = 'flex';
            iframe.src = proxies[0].url;
        }

        function openRealTikTok() {
            openProxyApp('REAL TIKTOK (Search tiktok.com in proxy or click red button ->):', [
                { name: 'Browser Proxy 1 (Frogie)', url: 'https://frogiesarcade.win/' },
                { name: 'Browser Proxy 2 (Szvy)', url: 'https://szvy.win/' },
                { name: 'Browser Proxy 3 (Selenite)', url: 'https://selenite.cc/' }
            ], 'https://www.tiktok.com/foryou');
        }

        function openRealRoblox() {
            openProxyApp('REAL ROBLOX:', [
                { name: 'Cloud 1 (Frogie)', url: 'https://frogiesarcade.win/' },
                { name: 'Cloud 2 (Szvy)', url: 'https://szvy.win/' },
                { name: 'Cloud 3 (Selenite)', url: 'https://selenite.cc/' }
            ], 'https://www.roblox.com/home');
        }

        function promptCustomLink() {
            const url = prompt("Enter a local file name (e.g. ./BuildNow.html) or full https:// link:");
            if (url) openApp(url.trim());
        }

        iframe.addEventListener('load', () => {
            if (iframe.src && iframe.src !== window.location.href) {
                iframe.focus();
                if (iframe.contentWindow) iframe.contentWindow.focus();
            }
        });

        function closeApp() {
            document.body.classList.remove('theater-active');
            proxyBar.style.display = 'none';
            document.getElementById('app-viewer').style.display = 'none';
            iframe.src = "";
        }

        function toggleTheaterMode() {
            document.body.classList.toggle('theater-active');
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) iframe.contentWindow.focus();
            }, 100);
        }

        async function goFullscreen() {
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                document.body.classList.add('theater-active');
                if (navigator.keyboard && navigator.keyboard.lock) {
                    await navigator.keyboard.lock(['Escape']);
                }
            } catch (e) {}
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) iframe.contentWindow.focus();
            }, 100);
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('theater-active');
                if (navigator.keyboard && navigator.keyboard.unlock) {
                    navigator.keyboard.unlock();
                }
            }
        });

        // 6. Tab Cloaking
        const favicon = document.getElementById("favicon");
        function cloakAsDocs() {
            document.title = "Google Docs";
            favicon.href = "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico";
        }
        function disguise() {
            document.title = "New Tab";
            favicon.href = "https://www.google.com/favicon.ico";
        }
        function restore() {
            document.title = "i-Ready";
            favicon.href = "https://login.i-ready.com/favicon.ico";
        }
        document.addEventListener("visibilitychange", () => { document.hidden ? disguise() : restore(); });
    </script>
</body>
</html>
