<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-Ready</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://login.i-ready.com/favicon.ico">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top left, #1a1a24, #0d0d12);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #00ff88;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            letter-spacing: 2px;
        }

        .search-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.3s;
        }

        .search-box:focus {
            border-color: #00ff88;
        }

        /* --- Sidebar Categories --- */
        .nav-category {
            font-size: 13px;
            font-weight: 700;
            color: #00ff88;
            letter-spacing: 1.5px;
            margin-top: 15px;
            margin-bottom: 8px;
            padding-left: 5px;
            text-transform: uppercase;
            border-left: 3px solid #00ff88;
        }

        .nav-link {
            padding: 10px 12px;
            color: #bbb;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .nav-link:hover {
            background: rgba(0, 255, 136, 0.08);
            color: #00ff88;
            padding-left: 16px;
        }

        /* --- Main Content Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Dashboard Grid --- */
        .dashboard {
            padding: 50px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            align-content: flex-start;
            overflow-y: auto;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00ff88;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.15);
        }

        .tiktok-card:hover {
            border-color: #ff0050;
            box-shadow: -5px 5px 15px rgba(0, 242, 254, 0.2), 5px -5px 15px rgba(255, 0, 80, 0.2);
        }

        .glass-card img {
            width: 64px;
            height: 64px;
            margin-bottom: 15px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
            z-index: 2;
        }

        .glass-card:hover img {
            transform: scale(1.1);
        }

        .glass-card span {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #eee;
            z-index: 2;
        }

        /* --- App Viewer Frame --- */
        #app-viewer {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .viewer-header {
            height: 55px;
            background: rgba(10, 10, 15, 0.98);
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
        }

        .action-btn {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: #000;
            outline: none;
        }

        /* --- Theater Mode --- */
        body.theater-active .sidebar,
        body.theater-active .viewer-header {
            display: none !important;
        }

        #exit-theater-btn {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 9999;
            background: rgba(10, 10, 15, 0.75);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.4);
            padding: 4px 10px;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.2s;
        }

        #exit-theater-btn:hover {
            opacity: 1;
            background: #00ff88;
            color: #000;
        }

        body.theater-active #exit-theater-btn {
            display: block;
        }
    </style>
</head>
<body>

    <button id="exit-theater-btn" onclick="toggleTheaterMode()">SHOW MENU</button>

    <!-- Sidebar / OS Menu -->
    <div class="sidebar">
        <div class="logo">VERTEX<br>OS</div>
        <input type="text" class="search-box" placeholder="Search systems...">

        <!-- Games Category -->
        <div class="nav-category">Games</div>
        <div class="nav-link" onclick="openApp('./eaglercraft.html')">Minecraft (Eagler)</div>
        <div class="nav-link" onclick="openApp('https://buildnow-gg.github.io/')">BuildNow GG</div>

        <!-- Apps Category -->
        <div class="nav-category" style="margin-top: 25px;">Apps</div>
        <div class="nav-link" onclick="openApp('https://YOUR_PROXY_LINK_HERE.com/tiktok')">TikTok</div>
        <div class="nav-link" onclick="openApp('https://now.gg/play/roblox-corporation/5349/roblox')">Roblox</div>
    </div>

    <!-- Main OS Workspace -->
    <div class="main-content">
        
        <!-- Dashboard App Grid -->
        <div class="dashboard" id="dashboard">
            
            <div class="glass-card" onclick="openApp('./eaglercraft.html')">
                <img src="https://minecraft.wiki/images/Grass_Block_JE4.png" alt="Eagler">
                <span>EAGLER</span>
            </div>
            
            <!-- FIXED BUILDNOW ICON -->
            <div class="glass-card" onclick="openApp('https://buildnow-gg.github.io/')">
                <img src="https://cdn-icons-png.flaticon.com/512/2921/2921222.png" style="filter: invert(1);" alt="BuildNow">
                <span>BUILDNOW</span>
            </div>

            <div class="glass-card tiktok-card" onclick="openApp('https://YOUR_PROXY_LINK_HERE.com/tiktok')">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" style="filter: invert(1);" alt="TikTok">
                <span>TIKTOK</span>
            </div>

            <div class="glass-card" onclick="openApp('https://now.gg/play/roblox-corporation/5349/roblox')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg" style="filter: invert(1);" alt="Roblox">
                <span>ROBLOX</span>
            </div>
            
        </div>

        <!-- Hidden Iframe Viewer -->
        <div id="app-viewer">
            <div class="viewer-header">
                <button class="action-btn" onclick="closeApp()">
                    <span>←</span> SYSTEM RETURN
                </button>
                
                <button class="action-btn" onclick="toggleTheaterMode()">
                    <span>[ ]</span> MAX WINDOW (NO ESC BUG)
                </button>

                <button class="action-btn" onclick="goFullscreen()">
                    <span>⛶</span> FULLSCREEN (HOLD ESC TO EXIT)
                </button>
            </div>
            
            <iframe id="main-frame" src="" tabindex="0" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; keyboard-map"></iframe>
        </div>

    </div>

    <script>
        const iframe = document.getElementById('main-frame');

        function openApp(url) {
            if (document.activeElement) document.activeElement.blur();
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('app-viewer').style.display = 'flex';
            
            const separator = url.includes('?') ? '&' : '?';
            iframe.src = url + separator + 'nocache=' + Date.now();
        }

        iframe.addEventListener('load', () => {
            if (iframe.src && iframe.src !== window.location.href) {
                iframe.focus();
                if (iframe.contentWindow) {
                    iframe.contentWindow.focus();
                }
            }
        });

        function closeApp() {
            document.body.classList.remove('theater-active');
            document.getElementById('dashboard').style.display = 'grid';
            document.getElementById('app-viewer').style.display = 'none';
            iframe.src = ""; 
        }

        function toggleTheaterMode() {
            document.body.classList.toggle('theater-active');
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) {
                    iframe.contentWindow.focus();
                }
            }, 100);
        }

        async function goFullscreen() {
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { 
                    await document.documentElement.webkitRequestFullscreen();
                }
                
                document.body.classList.add('theater-active');

                if (navigator.keyboard && navigator.keyboard.lock) {
                    await navigator.keyboard.lock(['Escape']);
                }
            } catch (err) {
                console.log("Fullscreen error:", err);
            }
            
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) {
                    iframe.contentWindow.focus();
                }
            }, 100);
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('theater-active');
                if (navigator.keyboard && navigator.keyboard.unlock) {
                    navigator.keyboard.unlock();
                }
            }
        });

        // Tab Cloaking
        const favicon = document.getElementById("favicon");
        const googleIcon = "https://www.google.com/favicon.ico";

        function disguise() { 
            document.title = "New Tab"; 
            favicon.href = googleIcon; 
        }
        
        function restore() { 
            document.title = "i-Ready"; 
            favicon.href = "https://login.i-ready.com/favicon.ico"; 
        }

        document.addEventListener("visibilitychange", () => { document.hidden ? disguise() : restore(); });
        window.addEventListener("blur", disguise);
        window.addEventListener("focus", restore);
    </script>
</body>
</html>
