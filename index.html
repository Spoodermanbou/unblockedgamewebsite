<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-Ready</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://login.i-ready.com/favicon.ico">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top left, #1a1a24, #0d0d12);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #00ff88;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            letter-spacing: 2px;
        }

        .search-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.3s;
        }

        .search-box:focus {
            border-color: #00ff88;
        }

        /* --- Sidebar Category Tabs --- */
        .nav-tabs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #aaa;
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tab-btn:hover {
            background: rgba(0, 255, 136, 0.08);
            color: #fff;
            border-color: rgba(0, 255, 136, 0.4);
            transform: translateX(4px);
        }

        .tab-btn.active {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        /* --- Main Content Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .category-header {
            padding: 35px 50px 0 50px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #00ff88;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.25);
        }

        /* --- Dashboard Grid --- */
        .dashboard {
            padding: 25px 50px 50px 50px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            align-content: flex-start;
            overflow-y: auto;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00ff88;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.15);
        }

        .tiktok-card:hover {
            border-color: #ff0050;
            box-shadow: -5px 5px 15px rgba(0, 242, 254, 0.2), 5px -5px 15px rgba(255, 0, 80, 0.2);
        }

        .glass-card img {
            width: 72px;
            height: 72px;
            margin-bottom: 15px;
            object-fit: cover;
            border-radius: 14px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
            z-index: 2;
        }

        .glass-card:hover img {
            transform: scale(1.1);
        }

        .glass-card span {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #eee;
            z-index: 2;
        }

        /* --- App Viewer Frame --- */
        #app-viewer {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .viewer-header {
            height: 55px;
            background: rgba(10, 10, 15, 0.98);
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: #000;
            outline: none;
        }

        /* --- Theater Mode --- */
        body.theater-active .sidebar,
        body.theater-active .viewer-header {
            display: none !important;
        }

        #exit-theater-btn {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 9999;
            background: rgba(10, 10, 15, 0.75);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.4);
            padding: 4px 10px;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.2s;
        }

            opacity
