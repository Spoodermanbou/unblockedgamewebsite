<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>i-Ready</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://login.i-ready.com/favicon.ico">

    <!-- AUTO CACHE BUSTER: Forces v800 -->
    <script>
        const CURRENT_BUILD = "v800";
        if (window.location.search !== "?" + CURRENT_BUILD) {
            window.location.replace(window.location.pathname + "?" + CURRENT_BUILD);
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0b0c;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        /* --- Floating Top Pill Navbar --- */
        .top-pill {
            margin-top: 18px;
            width: 480px;
            max-width: 92vw;
            height: 54px;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
            color: #00ff88;
        }

        .brand-logo span.mascot {
            font-size: 24px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.4));
            transition: transform 0.2s;
        }

        .brand-logo:hover span.mascot {
            transform: scale(1.15) rotate(-8deg);
        }

        .nav-icons {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #b0b0b8;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-2px);
        }

        .icon-btn.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
        }

        /* --- Boot Splash Loader (4 Glowing Dots) --- */
        #boot-screen {
            position: absolute;
            inset: 0;
            background: #0b0b0c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            transition: opacity 0.4s ease;
        }

        .dots-spinner {
            position: relative;
            width: 90px;
            height: 90px;
            animation: spinSlow 2.6s linear infinite;
            margin-bottom: 18px;
        }

        @keyframes spinSlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dot {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }

        .dot.red-top {
            top: 4px;
            left: 37px;
            background: #ff1e1e;
            box-shadow: 0 0 18px 4px rgba(255, 30, 30, 0.85);
        }

        .dot.red-bottom {
            bottom: 4px;
            left: 37px;
            background: #ff1e1e;
            box-shadow: 0 0 18px 4px rgba(255, 30, 30, 0.85);
        }

        .dot.green-left {
            top: 37px;
            left: 4px;
            background: #00ff44;
            box-shadow: 0 0 18px 4px rgba(0, 255, 68, 0.85);
        }

        .dot.green-right {
            top: 37px;
            right: 4px;
            background: #00ff44;
            box-shadow: 0 0 18px 4px rgba(0, 255, 68, 0.85);
        }

        .boot-date {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        .boot-counter {
            position: absolute;
            bottom: 110px;
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        /* --- Main Workspace & Search --- */
        .workspace {
            flex: 1;
            width: 100%;
            max-width: 1050px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 30px;
            overflow-y: auto;
            z-index: 10;
        }

        .search-wrap {
            width: 100%;
            max-width: 420px;
            margin-bottom: 28px;
        }

        .search-input {
            width: 100%;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 12px 18px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            text-align: center;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: rgba(0, 255, 136, 0.5);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.15);
        }

        /* --- App & Game Grid --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .item-card {
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 22px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.22s ease;
        }

        .item-card:hover {
            background: #1c1c21;
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
        }

        .item-card img {
            width: 68px;
            height: 68px;
            border-radius: 14px;
            object-fit: cover;
            margin-bottom: 12px;
            transition: transform 0.22s ease;
        }

        .item-card:hover img {
            transform: scale(1.08);
        }

        .item-card span {
            font-size: 14px;
            font-weight: 700;
            color: #e4e4e7;
            letter-spacing: 0.4px;
            text-align: center;
        }

        /* --- Custom Neon GTA VI Badge Icon --- */
        .gta-icon {
            width: 68px;
            height: 68px;
            border-radius: 14px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ff007f 0%, #7928ca 50%, #ff8c00 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 0, 127, 0.35);
            transition: transform 0.22s ease;
            line-height: 1;
        }

        .gta-icon .gta-top {
            font-size: 15px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .gta-icon .gta-num {
            font-size: 26px;
            color: #ffe600;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .item-card:hover .gta-icon {
            transform: scale(1.08);
        }

        /* --- Floating Bottom Pill Bar --- */
        .bottom-pill {
            margin-bottom: 16px;
            width: 480px;
            max-width: 92vw;
            height: 48px;
            background: #151518;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .online-status {
            font-size: 13px;
            font-weight: 700;
            color: #d4d4d8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff44;
            box-shadow: 0 0 8px #00ff44;
        }

        /* --- Fullscreen Game / App Viewer --- */
        #app-viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            flex-direction: column;
        }

        .viewer-bar {
            height: 48px;
            background: #121215;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: #1f1f24;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .ctrl-btn:hover {
            background: #00ff88;
            color: #000;
            border-color: #00ff88;
        }

        #main-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        body.theater-active .viewer-bar {
            display: none !important;
        }

        #floating-back-btn {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 9999;
            background: rgba(21, 21, 24, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.2s;
        }

        #floating-back-btn:hover {
            opacity: 1;
            background: #00ff88;
            color: #000;
        }

        body.theater-active #floating-back-btn {
            display: block;
        }
    </style>
</head>
<body>

    <button id="floating-back-btn" onclick="toggleTheaterMode()">SHOW BAR</button>

    <!-- 1. TOP FLOATING PILL NAVBAR -->
    <div class="top-pill">
        <div class="brand-logo" onclick="switchCategory('games')">
            <span class="mascot">🦖</span>
            <span>VERTEX</span>
        </div>

        <div class="nav-icons">
            <button class="icon-btn active" id="btn-games" title="Games" onclick="switchCategory('games')">
                <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            </button>

            <button class="icon-btn" id="btn-apps" title="Apps" onclick="switchCategory('apps')">
                <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm0 10h8v8H3v-8zM13 3h8v8h-8V3zm0 10h8v8h-8v-8z"/></svg>
            </button>

            <button class="icon-btn" id="btn-plus" title="Open Custom Link or File" onclick="promptCustomLink()">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </div>
    </div>

    <!-- 2. BOOT SCREEN -->
    <div id="boot-screen">
        <div class="dots-spinner">
            <div class="dot red-top"></div>
            <div class="dot green-right"></div>
            <div class="dot red-bottom"></div>
            <div class="dot green-left"></div>
        </div>
        <div class="boot-date">11/14/26 ❤️</div>
        <div class="boot-counter" id="load-counter">0/674 loaded...</div>
    </div>

    <!-- 3. MAIN WORKSPACE -->
    <div class="workspace">
        <div class="search-wrap">
            <input type="text" id="search-input" class="search-input" placeholder="Search games or apps..." oninput="filterItems()">
        </div>

        <div class="grid-container" id="grid">
            
            <!-- ================= GAMES TAB (All 100% Local HTML Repo Files) ================= -->
            <div class="item-card" data-category="games" onclick="openApp('./eaglercraft.html')">
                <img src="https://minecraft.wiki/images/Grass_Block_JE4.png" style="object-fit: contain; border-radius: 0;" alt="Eagler">
                <span>EaglerCraft</span>
            </div>

            <div class="item-card" data-category="games" onclick="openApp('./BuildNow.html')">
                <img src="https://play-lh.googleusercontent.com/Jkx-IPLeRDk4uKeDyIMWKQ6jv9RquAC0WErGzWIMZQK7Z8FKzsqbUtC0J7vTm24xIqnme3TZR-6a8WAj6EXP_DA=s256-rw" alt="BuildNow">
                <span>BuildNow GG</span>
            </div>

            <!-- PEOPLE PLAYGROUND CARD ADDED HERE -->
            <div class="item-card" data-category="games" onclick="openApp('./peopleplayground.html')">
                <img src="https://cdn-icons-png.flaticon.com/512/3408/3408506.png" style="filter: invert(1); object-fit: contain; border-radius: 0;" alt="People Playground">
                <span>People<br>Playground</span>
            </div>

            <!-- GTA VI LOCAL HTML FILE -->
            <div class="item-card" data-category="games" onclick="openApp('./GTAVI.html')">
                <div class="gta-icon">
                    <span class="gta-top">GTA</span>
                    <span class="gta-num">VI</span>
                </div>
                <span>GTA VI</span>
            </div>

            <!-- ================= APPS TAB ================= -->
            <div class="item-card" data-category="apps" style="display: none;" onclick="openApp('./TikTok.html')">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" style="filter: invert(1); object-fit: contain; border-radius: 0;" alt="TikTok">
                <span>TikTok</span>
            </div>

        </div>
    </div>

    <!-- 4. BOTTOM FLOATING PILL BAR -->
    <div class="bottom-pill">
        <div class="online-status">
            <div class="online-dot"></div>
            <span id="online-count">online users: 688</span>
        </div>

        <div class="nav-icons">
            <button class="icon-btn" title="Cloak Tab as Google Docs" onclick="cloakAsDocs()">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>

            <button class="icon-btn" title="Open Entire Site in Cloaked about:blank" onclick="openSiteInAboutBlank()">
                <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            </button>
        </div>
    </div>

    <!-- 5. GAME VIEWER OVERLAY -->
    <div id="app-viewer">
        <div class="viewer-bar">
            <button class="ctrl-btn" onclick="closeApp()">← Back</button>
            <button class="ctrl-btn" onclick="toggleTheaterMode()">[ ] Hide Bar (No Esc Bug)</button>
            <button class="ctrl-btn" onclick="goFullscreen()">⛶ Fullscreen (Lock Esc)</button>
        </div>

        <iframe id="main-frame" src="" tabindex="0" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; keyboard-map"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('main-frame');
        let currentCategory = 'games';

        // 1. Boot Loader Animation
        let loadedCount = 0;
        const totalToLoad = 674;
        const counterEl = document.getElementById('load-counter');
        const bootScreen = document.getElementById('boot-screen');

        const bootInterval = setInterval(() => {
            loadedCount += Math.floor(Math.random() * 95) + 45;
            if (loadedCount >= totalToLoad) {
                loadedCount = totalToLoad;
                counterEl.innerText = `${loadedCount}/${totalToLoad} loaded...`;
                clearInterval(bootInterval);
                setTimeout(() => {
                    bootScreen.style.opacity = '0';
                    setTimeout(() => bootScreen.style.display = 'none', 400);
                }, 250);
            } else {
                counterEl.innerText = `${loadedCount}/${totalToLoad} loaded...`;
            }
        }, 80);

        // 2. Fluctuating Online Users Counter
        setInterval(() => {
            const base = 680;
            const diff = Math.floor(Math.random() * 25) - 10;
            document.getElementById('online-count').innerText = `online users: ${base + diff}`;
        }, 5000);

        // 3. Category Switching
        function switchCategory(category) {
            currentCategory = category;
            if (document.getElementById('app-viewer').style.display === 'flex') {
                closeApp();
            }
            document.getElementById('btn-games').classList.toggle('active', category === 'games');
            document.getElementById('btn-apps').classList.toggle('active', category === 'apps');
            filterItems();
        }

        function filterItems() {
            const q = document.getElementById('search-input').value.toLowerCase();
            document.querySelectorAll('.item-card').forEach(card => {
                const matchCat = card.getAttribute('data-category') === currentCategory;
                const matchText = card.querySelector('span').innerText.toLowerCase().includes(q);
                card.style.display = (matchCat && matchText) ? 'flex' : 'none';
            });
        }

        // 4. Local HTML Game Opener
        function openApp(url) {
            if (document.activeElement) document.activeElement.blur();
            document.getElementById('app-viewer').style.display = 'flex';
            // We removed ?nocache= here so People Playground's internal loader doesn't break
            iframe.src = url;
        }

        function promptCustomLink() {
            const url = prompt("Enter a local file in your repo (e.g. ./GTAVI.html) or URL:");
            if (url) openApp(url.trim());
        }

        function openSiteInAboutBlank() {
            const win = window.open('about:blank', '_blank');
            if (!win) return alert('Please allow popups for Vertex OS!');
            win.document.write(`<!DOCTYPE html><html><head><title>i-Ready</title><link rel="icon" href="https://login.i-ready.com/favicon.ico"><style>body,html,iframe{margin:0;padding:0;width:100%;height:100%;border:none;overflow:hidden;background:#000;}</style></head><body><iframe src="${window.location.href}" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; keyboard-map"></iframe></body></html>`);
            win.document.close();
        }

        iframe.addEventListener('load', () => {
            if (iframe.src && iframe.src !== window.location.href) {
                iframe.focus();
                if (iframe.contentWindow) iframe.contentWindow.focus();
            }
        });

        function closeApp() {
            document.body.classList.remove('theater-active');
            document.getElementById('app-viewer').style.display = 'none';
            iframe.src = "";
        }

        function toggleTheaterMode() {
            document.body.classList.toggle('theater-active');
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) iframe.contentWindow.focus();
            }, 100);
        }

        async function goFullscreen() {
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
                document.body.classList.add('theater-active');
                if (navigator.keyboard && navigator.keyboard.lock) {
                    await navigator.keyboard.lock(['Escape']);
                }
            } catch (e) {}
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) iframe.contentWindow.focus();
            }, 100);
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('theater-active');
                if (navigator.keyboard && navigator.keyboard.unlock) {
                    navigator.keyboard.unlock();
                }
            }
        });

        // 5. Tab Cloaking
        const favicon = document.getElementById("favicon");
        function cloakAsDocs() {
            document.title = "Google Docs";
            favicon.href = "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico";
        }
        function disguise() {
            document.title = "New Tab";
            favicon.href = "https://www.google.com/favicon.ico";
        }
        function restore() {
            document.title = "i-Ready";
            favicon.href = "https://login.i-ready.com/favicon.ico";
        }
        document.addEventListener("visibilitychange", () => { document.hidden ? disguise() : restore(); });
    </script>
</body>
</html>
