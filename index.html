<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-Ready</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://login.i-ready.com/favicon.ico">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top left, #1a1a24, #0d0d12);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            width: 260px;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: #00ff88;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            letter-spacing: 2px;
        }

        .search-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border 0.3s;
        }

        .search-box:focus {
            border-color: #00ff88;
        }

        /* --- Sidebar Category Tabs --- */
        .nav-tabs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #aaa;
            padding: 14px 18px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tab-btn:hover {
            background: rgba(0, 255, 136, 0.08);
            color: #fff;
            border-color: rgba(0, 255, 136, 0.4);
            transform: translateX(4px);
        }

        .tab-btn.active {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        /* --- Main Content Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .category-header {
            padding: 35px 50px 0 50px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #00ff88;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.25);
        }

        /* --- Dashboard Grid --- */
        .dashboard {
            padding: 25px 50px 50px 50px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            align-content: flex-start;
            overflow-y: auto;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00ff88;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 255, 136, 0.15);
        }

        .tiktok-card:hover {
            border-color: #ff0050;
            box-shadow: -5px 5px 15px rgba(0, 242, 254, 0.2), 5px -5px 15px rgba(255, 0, 80, 0.2);
        }

        .glass-card img {
            width: 72px;
            height: 72px;
            margin-bottom: 15px;
            object-fit: cover;
            border-radius: 14px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
            z-index: 2;
        }

        .glass-card:hover img {
            transform: scale(1.1);
        }

        .glass-card span {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #eee;
            z-index: 2;
        }

        /* --- App Viewer Frame --- */
        #app-viewer {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .viewer-header {
            height: 55px;
            background: rgba(10, 10, 15, 0.98);
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(0, 255, 136, 0.12);
            color: #00ff88;
            border: 1px solid #00ff88;
            padding: 7px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }

        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
            background: #000;
            outline: none;
        }

        /* --- Theater Mode --- */
        body.theater-active .sidebar,
        body.theater-active .viewer-header {
            display: none !important;
        }

        #exit-theater-btn {
            display: none;
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 9999;
            background: rgba(10, 10, 15, 0.75);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.4);
            padding: 4px 10px;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.2s;
        }

        #exit-theater-btn:hover {
            opacity: 1;
            background: #00ff88;
            color: #000;
        }

        body.theater-active #exit-theater-btn {
            display: block;
        }
    </style>
</head>
<body>

    <button id="exit-theater-btn" onclick="toggleTheaterMode()">SHOW MENU</button>

    <!-- Sidebar / OS Menu with Category Tabs -->
    <div class="sidebar">
        <div class="logo">VERTEX<br>OS</div>
        <input type="text" id="search-input" class="search-box" placeholder="Search systems..." oninput="filterCards()">

        <div class="nav-tabs">
            <button class="tab-btn active" id="tab-games" onclick="switchCategory('games')">
                <span>🎮</span> GAMES
            </button>
            <button class="tab-btn" id="tab-apps" onclick="switchCategory('apps')">
                <span>📱</span> APPS
            </button>
        </div>
    </div>

    <!-- Main OS Workspace -->
    <div class="main-content">
        
        <div id="category-title" class="category-header">GAMES</div>

        <!-- Dashboard App Grid -->
        <div class="dashboard" id="dashboard">
            
            <!-- ================= GAMES CATEGORY ================= -->
            <div class="glass-card" data-category="games" onclick="openApp('./eaglercraft.html')">
                <img src="https://minecraft.wiki/images/Grass_Block_JE4.png" style="border-radius: 0; object-fit: contain;" alt="Eagler">
                <span>EAGLER</span>
            </div>
            
            <div class="glass-card" data-category="games" onclick="launchBuildNow()">
                <img src="https://play-lh.googleusercontent.com/Jkx-IPLeRDk4uKeDyIMWKQ6jv9RquAC0WErGzWIMZQK7Z8FKzsqbUtC0J7vTm24xIqnme3TZR-6a8WAj6EXP_DA=s256-rw" alt="BuildNow">
                <span>BUILDNOW</span>
            </div>

            <!-- ================= APPS CATEGORY ================= -->
            <div class="glass-card tiktok-card" data-category="apps" style="display: none;" onclick="launchTikTok()">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" style="filter: invert(1); border-radius: 0; object-fit: contain;" alt="TikTok">
                <span>TIKTOK</span>
            </div>

            <div class="glass-card" data-category="apps" style="display: none;" onclick="launchRoblox()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg" style="filter: invert(1); border-radius: 0; object-fit: contain;" alt="Roblox">
                <span>ROBLOX</span>
            </div>
            
        </div>

        <!-- Hidden Iframe Viewer -->
        <div id="app-viewer">
            <div class="viewer-header">
                <button class="action-btn" onclick="closeApp()">
                    <span>←</span> SYSTEM RETURN
                </button>
                
                <button class="action-btn" onclick="toggleTheaterMode()">
                    <span>[ ]</span> MAX WINDOW (NO ESC BUG)
                </button>

                <button class="action-btn" onclick="goFullscreen()">
                    <span>⛶</span> FULLSCREEN (HOLD ESC TO EXIT)
                </button>
            </div>
            
            <iframe id="main-frame" src="" tabindex="0" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; keyboard-map; microphone; camera"></iframe>
        </div>

    </div>

    <script>
        const iframe = document.getElementById('main-frame');
        let currentCategory = 'games';

        function switchCategory(category) {
            currentCategory = category;

            if (document.getElementById('app-viewer').style.display === 'flex') {
                closeApp();
            }

            document.getElementById('tab-games').classList.toggle('active', category === 'games');
            document.getElementById('tab-apps').classList.toggle('active', category === 'apps');
            document.getElementById('category-title').innerText = category.toUpperCase();

            filterCards();
        }

        function filterCards() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.glass-card');

            cards.forEach(card => {
                const matchesCategory = card.getAttribute('data-category') === currentCategory;
                const title = card.querySelector('span').innerText.toLowerCase();
                const matchesSearch = title.includes(query);

                card.style.display = (matchesCategory && matchesSearch) ? 'flex' : 'none';
            });
        }

        function showViewer() {
            if (document.activeElement) document.activeElement.blur();
            document.getElementById('category-title').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('app-viewer').style.display = 'flex';
        }

        function openApp(url) {
            showViewer();
            iframe.removeAttribute('srcdoc');
            const separator = url.includes('?') ? '&' : '?';
            iframe.src = url + separator + 'nocache=' + Date.now();
        }

        // Reusable Multi-Server App Launcher (Used for TikTok & Roblox so no separate HTML files are needed!)
        function launchMultiServerApp(appName, servers) {
            showViewer();
            iframe.src = "about:blank";

            const buttonsHtml = servers.map((srv, idx) => 
                `<button class="srv-btn ${idx === 0 ? 'active' : ''}" onclick="switchSrv('${srv.url}', this)">${srv.name}</button>`
            ).join('');

            iframe.srcdoc = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0d12; font-family: sans-serif; display: flex; flex-direction: column; }
        .server-bar { min-height: 40px; background: #14141d; border-bottom: 1px solid rgba(0,255,136,0.3); display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: #aaa; z-index: 20; flex-wrap: wrap; }
        .srv-btn { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid #00ff88; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; transition: 0.2s; }
        .srv-btn:hover, .srv-btn.active { background: #00ff88; color: #000; }
        .custom-box { margin-left: auto; display: flex; gap: 6px; align-items: center; }
        .custom-input { background: #000; border: 1px solid #444; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; width: 200px; outline: none; }
        .custom-input:focus { border-color: #00ff88; }
        #game-wrap { flex: 1; position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; background: #0a0a0f; display: block; }
    </style>
</head>
<body>
    <div class="server-bar">
        <span>${appName} SERVERS:</span>
        ${buttonsHtml}
        <div class="custom-box">
            <input type="text" id="custom-url" class="custom-input" placeholder="Paste custom proxy/mirror link...">
            <button class="srv-btn" onclick="loadCustom()">GO</button>
        </div>
    </div>
    <div id="game-wrap">
        <iframe id="inner-frame" src="${servers[0].url}" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; keyboard-map; microphone; camera"></iframe>
    </div>
    <script>
        function switchSrv(url, btn) {
            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            const f = document.getElementById('inner-frame');
            f.src = url;
            f.onload = () => f.focus();
        }
        function loadCustom() {
            let val = document.getElementById('custom-url').value.trim();
            if (!val) return;
            if (!val.startsWith('http')) val = 'https://' + val;
            switchSrv(val, null);
        }
    <\/script>
</body>
</html>`;
        }

        // TIKTOK LAUNCHER (Uses Embeddable ProxiTok Viewers + Unblocked Web Proxies)
        function launchTikTok() {
            launchMultiServerApp('TIKTOK', [
                { name: 'Server 1 (ProxiTok Trending)', url: 'https://proxitok.pabloferreiro.es/trending' },
                { name: 'Server 2 (ProxiTok Backup)', url: 'https://tok.habedieeh.re/trending' },
                { name: 'Server 3 (OffTikTok Viewer)', url: 'https://www.offtiktok.com/' },
                { name: 'Server 4 (UrleBird TikTok)', url: 'https://urlebird.com/trending/' }
            ]);
        }

        // ROBLOX LAUNCHER (Uses Cloud Gaming Mirrors + Unblocked Portals)
        function launchRoblox() {
            launchMultiServerApp('ROBLOX', [
                { name: 'Server 1 (Frogies Cloud Hub)', url: 'https://frogiesarcade.win/' },
                { name: 'Server 2 (Selenite Portal)', url: 'https://selenite.cc/' },
                { name: 'Server 3 (NowGG Direct)', url: 'https://now.gg/apps/roblox-corporation/5349/roblox.html' },
                { name: 'Server 4 (Szvy Central Proxy)', url: 'https://szvy.win/' }
            ]);
        }

        // BUILDNOW GG LAUNCHER
        function launchBuildNow() {
            showViewer();
            iframe.src = "about:blank";
            iframe.srcdoc = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0d12; font-family: sans-serif; display: flex; flex-direction: column; }
        .server-bar { height: 36px; background: #14141d; border-bottom: 1px solid rgba(0,255,136,0.3); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; color: #aaa; z-index: 20; }
        .srv-btn { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid #00ff88; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 11px; }
        .srv-btn:hover, .srv-btn.active { background: #00ff88; color: #000; }
        #game-wrap { flex: 1; position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; background: #000; display: block; }
        #status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ff88; font-weight: bold; font-size: 18px; text-align: center; }
    </style>
</head>
<body>
    <div class="server-bar">
        <span>BUILDNOW SERVERS:</span>
        <button class="srv-btn active" onclick="loadSingleFileCDN(this)">Server 1 (jsDelivr Direct)</button>
        <button class="srv-btn" onclick="loadDirectUrl('https://genizymath.github.io/games/buildnowgg/', this)">Server 2 (GN-Math)</button>
        <button class="srv-btn" onclick="loadDirectUrl('https://ashton20271.github.io/unblockedgames/clbuildnowgg.html', this)">Server 3 (Ashton GitHub)</button>
        <button class="srv-btn" onclick="loadDirectUrl('https://build-now-gg.github.io/', this)">Server 4 (Build-Now-GG)</button>
    </div>
    <div id="game-wrap">
        <div id="status-msg">FETCHING BUILDNOW ENGINE FROM JSDELIVR...</div>
    </div>
    <script>
        function setActive(btn) {
            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function loadDirectUrl(url, btn) {
            setActive(btn);
            const wrap = document.getElementById('game-wrap');
            wrap.innerHTML = '<iframe id="inner-game" src="' + url + '" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; keyboard-map"></iframe>';
            const f = document.getElementById('inner-game');
            f.onload = () => f.focus();
        }

        async function loadSingleFileCDN(btn) {
            setActive(btn);
            const wrap = document.getElementById('game-wrap');
            wrap.innerHTML = '<div id="status-msg">FETCHING BUILDNOW ENGINE FROM JSDELIVR...</div>';
            try {
                const res = await fetch('https://cdn.jsdelivr.net/npm/ugs-singlefiles@1.0.6/UGS-Files/clbuildnowgg.html');
                if (!res.ok) throw new Error('CDN response not ok');
                const htmlCode = await res.text();
                
                wrap.innerHTML = '<iframe id="inner-game" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; keyboard-map"></iframe>';
                const f = document.getElementById('inner-game');
                f.srcdoc = htmlCode;
                f.onload = () => f.focus();
            } catch (e) {
                loadDirectUrl('https://genizymath.github.io/games/buildnowgg/', document.querySelectorAll('.srv-btn')[1]);
            }
        }

        loadSingleFileCDN(document.querySelector('.srv-btn'));
    <\/script>
</body>
</html>`;
        }

        iframe.addEventListener('load', () => {
            if ((iframe.src && iframe.src !== window.location.href) || iframe.srcdoc) {
                iframe.focus();
                if (iframe.contentWindow) {
                    iframe.contentWindow.focus();
                }
            }
        });

        function closeApp() {
            document.body.classList.remove('theater-active');
            document.getElementById('category-title').style.display = 'block';
            document.getElementById('dashboard').style.display = 'grid';
            document.getElementById('app-viewer').style.display = 'none';
            iframe.removeAttribute('srcdoc');
            iframe.src = ""; 
        }

        function toggleTheaterMode() {
            document.body.classList.toggle('theater-active');
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) {
                    iframe.contentWindow.focus();
                }
            }, 100);
        }

        async function goFullscreen() {
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { 
                    await document.documentElement.webkitRequestFullscreen();
                }
                
                document.body.classList.add('theater-active');

                if (navigator.keyboard && navigator.keyboard.lock) {
                    await navigator.keyboard.lock(['Escape']);
                }
            } catch (err) {
                console.log("Fullscreen error:", err);
            }
            
            setTimeout(() => {
                iframe.focus();
                if (iframe.contentWindow) {
                    iframe.contentWindow.focus();
                }
            }, 100);
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.body.classList.remove('theater-active');
                if (navigator.keyboard && navigator.keyboard.unlock) {
                    navigator.keyboard.unlock();
                }
            }
        });

        // Tab Cloaking
        const favicon = document.getElementById("favicon");
        const googleIcon = "https://www.google.com/favicon.ico";

        function disguise() { 
            document.title = "New Tab"; 
            favicon.href = googleIcon; 
        }
        
        function restore() { 
            document.title = "i-Ready"; 
            favicon.href = "https://login.i-ready.com/favicon.ico"; 
        }

        document.addEventListener("visibilitychange", () => { document.hidden ? disguise() : restore(); });
        window.addEventListener("blur", disguise);
        window.addEventListener("focus", restore);
    </script>
</body>
</html>
