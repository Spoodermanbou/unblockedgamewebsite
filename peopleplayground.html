<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/people-playground/">
    <title>Unity WebGL Player | People Playground</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0b0c;
            font-family: 'Inter', sans-serif;
        }
        #unity-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #unity-canvas {
            width: 100vw;
            height: 100vh;
            background: #0b0b0c;
            display: block;
        }
        #loader-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 380px;
            pointer-events: none;
        }
        #loading-text {
            color: #00ff88;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }
        #sub-status {
            color: #888;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        #bar-fill {
            width: 0%;
            height: 100%;
            background: #00ff88;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div id="loader-ui">
        <div id="loading-text">CONNECTING TO CDN...</div>
        <div id="sub-status">0.0 MB downloaded (Chunk 0/9)</div>
        <div class="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
        const loadingText = document.getElementById("loading-text");
        const subStatus = document.getElementById("sub-status");
        const barFill = document.getElementById("bar-fill");
        const loaderUi = document.getElementById("loader-ui");
        const canvas = document.getElementById("unity-canvas");

        const MIRRORS = [
            "https://cdn.jsdelivr.net/gh/genizy/web-port@main/people-playground/",
            "https://cdn.jsdelivr.net/gh/bubbls/ugss@main/people-playground/",
            "https://raw.githubusercontent.com/genizy/web-port/main/people-playground/"
        ];

        let activeBase = MIRRORS[0];
        let completedChunks = 0;
        let totalBytesLoaded = 0;
        const totalChunks = 9;

        function getParts(file, start, end) {
            const parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        // Fetches JS files as text and wraps them in a local application/javascript Blob to bypass Chrome's text/plain block
        async function fetchScriptAsBlobUrl(relativePath) {
            for (const mirror of MIRRORS) {
                try {
                    const res = await fetch(mirror + relativePath);
                    if (!res.ok) continue;
                    const jsText = await res.text();
                    const jsBlob = new Blob([jsText], { type: "application/javascript" });
                    return URL.createObjectURL(jsBlob);
                } catch (e) {}
            }
            throw new Error("Could not fetch script: " + relativePath);
        }

        async function fetchPartWithLiveProgress(relativePath) {
            let lastErr = null;
            for (const mirror of MIRRORS) {
                try {
                    const response = await fetch(mirror + relativePath);
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    activeBase = mirror;

                    if (!response.body) {
                        const buf = await response.arrayBuffer();
                        totalBytesLoaded += buf.byteLength;
                        completedChunks++;
                        return buf;
                    }

                    const reader = response.body.getReader();
                    const chunks = [];
                    let receivedLength = 0;

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        receivedLength += value.length;
                        totalBytesLoaded += value.length;

                        const mb = (totalBytesLoaded / (1024 * 1024)).toFixed(1);
                        loadingText.innerText = "DOWNLOADING PEOPLE PLAYGROUND...";
                        subStatus.innerText = `${mb} MB downloaded (Chunk ${completedChunks + 1}/${totalChunks})`;
                        const approxPct = Math.min(82, Math.round((totalBytesLoaded / (156 * 1024 * 1024)) * 82));
                        barFill.style.width = approxPct + "%";
                    }

                    const combined = new Uint8Array(receivedLength);
                    let position = 0;
                    for (const chunk of chunks) {
                        combined.set(chunk, position);
                        position += chunk.length;
                    }

                    completedChunks++;
                    return combined.buffer;
                } catch (err) {
                    lastErr = err;
                }
            }
            throw lastErr || new Error("All mirrors failed for " + relativePath);
        }

        async function mergeFiles(fileParts) {
            const buffers = [];
            for (const part of fileParts) {
                const buf = await fetchPartWithLiveProgress(part);
                buffers.push(buf);
            }
            const mergedBlob = new Blob(buffers, { type: "application/octet-stream" });
            return URL.createObjectURL(mergedBlob);
        }

        async function bootGame() {
            try {
                const wasmUrl = await mergeFiles(getParts("Build/PPG.wasm", 1, 3));
                const dataUrl = await mergeFiles(getParts("Build/PPG.data", 1, 6));

                loadingText.innerText = "LOADING UNITY SCRIPTS...";
                subStatus.innerText = "Creating local JS execution blobs...";
                barFill.style.width = "85%";

                const [loaderBlobUrl, frameworkBlobUrl] = await Promise.all([
                    fetchScriptAsBlobUrl("Build/PPG.loader.js"),
                    fetchScriptAsBlobUrl("Build/PPG.framework.js")
                ]);

                const origFetch = window.fetch;
                window.fetch = function(input, init) {
                    if (typeof input === "string") {
                        if (input.includes("PPG.wasm")) return origFetch(wasmUrl, init);
                        if (input.includes("PPG.data")) return origFetch(dataUrl, init);
                        if (input.includes("PPG.framework.js")) return origFetch(frameworkBlobUrl, init);
                    }
                    return origFetch(input, init);
                };

                const origOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                    if (typeof url === "string") {
                        if (url.includes("PPG.wasm")) url = wasmUrl;
                        if (url.includes("PPG.data")) url = dataUrl;
                        if (url.includes("PPG.framework.js")) url = frameworkBlobUrl;
                    }
                    return origOpen.call(this, method, url, ...rest);
                };

                const config = {
                    dataUrl: dataUrl,
                    frameworkUrl: frameworkBlobUrl,
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: activeBase + "StreamingAssets",
                    companyName: "Studio Minus",
                    productName: "People Playground",
                    productVersion: "1.0"
                };

                const script = document.createElement("script");
                script.src = loaderBlobUrl;
                script.onload = () => {
                    createUnityInstance(canvas, config, (progress) => {
                        const totalPct = 85 + Math.round(progress * 15);
                        loadingText.innerText = "BOOTING ENGINE... " + Math.round(progress * 100) + "%";
                        subStatus.innerText = "Initializing physics & ragdoll assets...";
                        barFill.style.width = totalPct + "%";
                    }).then(() => {
                        loaderUi.style.display = "none";
                        canvas.focus();
                    }).catch((err) => {
                        loadingText.innerText = "ENGINE ERROR";
                        subStatus.innerText = String(err);
                    });
                };
                script.onerror = (e) => {
                    loadingText.innerText = "SCRIPT BLOB ERROR";
                    subStatus.innerText = "Could not execute PPG.loader.js blob.";
                };
                document.body.appendChild(script);

            } catch (err) {
                loadingText.innerText = "DOWNLOAD BLOCKED OR FAILED";
                subStatus.innerText = err.message;
            }
        }

        bootGame();
    </script>
</body>
</html>
