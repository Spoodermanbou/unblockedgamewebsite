<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/people-playground/">
    <title>Unity WebGL Player | People Playground</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0b0c;
            font-family: 'Inter', sans-serif;
        }
        #unity-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #unity-canvas {
            width: 100vw;
            height: 100vh;
            background: #0b0b0c;
            display: block;
        }
        #loader-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 340px;
            pointer-events: none;
        }
        #loading-text {
            color: #00ff88;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }
        .bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }
        #bar-fill {
            width: 0%;
            height: 100%;
            background: #00ff88;
            transition: width 0.15s ease;
        }
    </style>
</head>
<body>
    <div id="loader-ui">
        <div id="loading-text">LOADING PEOPLE PLAYGROUND (0/9)...</div>
        <div class="bar-bg"><div id="bar-fill"></div></div>
    </div>

    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script>
        const loadingText = document.getElementById("loading-text");
        const barFill = document.getElementById("bar-fill");
        const loaderUi = document.getElementById("loader-ui");
        const canvas = document.getElementById("unity-canvas");

        const cdnBase = "https://cdn.jsdelivr.net/gh/genizy/web-port@main/people-playground/";
        let loadedChunks = 0;
        const totalChunks = 9; // 3 WASM parts + 6 DATA parts

        function getParts(file, start, end) {
            const parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(cdnBase + file + ".part" + i);
            }
            return parts;
        }

        async function mergeFiles(fileParts) {
            const buffers = [];
            for (const partUrl of fileParts) {
                const res = await fetch(partUrl);
                if (!res.ok) throw new Error("Failed to load " + partUrl);
                const buf = await res.arrayBuffer();
                buffers.push(buf);
                loadedChunks++;
                const pct = Math.round((loadedChunks / totalChunks) * 80);
                loadingText.innerText = `DOWNLOADING ASSETS (${loadedChunks}/${totalChunks})...`;
                barFill.style.width = pct + "%";
            }
            const mergedBlob = new Blob(buffers, { type: "application/octet-stream" });
            return URL.createObjectURL(mergedBlob);
        }

        async function bootPeoplePlayground() {
            try {
                const [wasmUrl, dataUrl] = await Promise.all([
                    mergeFiles(getParts("Build/PPG.wasm", 1, 3)),
                    mergeFiles(getParts("Build/PPG.data", 1, 6))
                ]);

                const buildUrl = cdnBase + "Build";
                const loaderUrl = buildUrl + "/PPG.loader.js";
                const config = {
                    dataUrl: dataUrl,
                    frameworkUrl: buildUrl + "/PPG.framework.js
