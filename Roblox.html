<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vertex Roblox Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Inter', sans-serif; }
        body, html { width: 100%; height: 100%; background: #0b0b0c; color: #fff; display: flex; flex-direction: column; overflow: hidden; }
        .engine-bar {
            height: 44px; background: #141418; border-bottom: 1px solid rgba(0, 255, 136, 0.25);
            display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 12px; flex-shrink: 0;
        }
        .engine-label { color: #00ff88; font-weight: 800; letter-spacing: 0.5px; margin-right: 4px; }
        .mode-btn {
            background: #1f1f26; color: #ccc; border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .mode-btn:hover, .mode-btn.active { background: #00ff88; color: #000; border-color: #00ff88; }
        #viewport { flex: 1; width: 100%; height: 100%; position: relative; background: #000; }
        iframe { width: 100%; height: 100%; border: none; display: block; background: #000; }
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #00ff88; font-weight: 800; font-size: 16px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="engine-bar">
        <span class="engine-label">ROBLOX MODE:</span>
        <button class="mode-btn active" onclick="bootSingleFile('https://cdn.jsdelivr.net/npm/ugs-singlefiles@1.0.6/UGS-Files/clobby99.html', this)">⚡ Roblox Obby (WebGL Engine)</button>
        <button class="mode-btn" onclick="bootFrame('https://bloxd.io/', this)">🧱 Bloxd Sandbox (Multiplayer)</button>
        <button class="mode-btn" onclick="bootCloudStream(this)">☁️ Official Roblox APK (Cloud VM)</button>
    </div>

    <div id="viewport">
        <div id="loader">BOOTING ROBLOX WEBGL ENGINE...</div>
        <iframe id="game-frame" allowfullscreen="true" allow="autoplay; fullscreen; pointer-lock; keyboard-map; gamepad"></iframe>
    </div>

    <script>
        const frame = document.getElementById('game-frame');
        const loader = document.getElementById('loader');

        function setActive(btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        // Pulls raw WebGL Roblox game straight from jsDelivr CDN (Never blocked by school filters!)
        async function bootSingleFile(cdnUrl, btn) {
            setActive(btn);
            loader.style.display = 'block';
            loader.innerText = 'LOADING ROBLOX WEBGL BINARY FROM CDN...';
            frame.removeAttribute('src');
            try {
                const res = await fetch(cdnUrl);
                const html = await res.text();
                frame.srcdoc = html;
                frame.onload = () => {
                    loader.style.display = 'none';
                    frame.focus();
                };
            } catch (e) {
                bootFrame('https://bloxd.io/', btn);
            }
        }

        function bootFrame(url, btn) {
            setActive(btn);
            loader.style.display = 'none';
            frame.removeAttribute('srcdoc');
            frame.src = url;
            frame.onload = () => frame.focus();
        }

        // Streams the Android Roblox Client via your own Proxy or Cloud VM
        function bootCloudStream(btn) {
            setActive(btn);
            loader.style.display = 'none';
            frame.removeAttribute('srcdoc');
            const customProxy = localStorage.getItem('vertex_custom_proxy') || '';
            const nowGgAndroidUrl = 'https://now.gg/apps/roblox-corporation/5349/roblox.html';
            
            if (customProxy) {
                const sep = customProxy.includes('?url=') ? '' : '/?url=';
                frame.src = customProxy.replace(/\/$/, '') + sep + encodeURIComponent(nowGgAndroidUrl);
            } else {
                frame.src = nowGgAndroidUrl;
            }
        }

        // Automatically boots the WebGL Roblox engine on open
        bootSingleFile('https://cdn.jsdelivr.net/npm/ugs-singlefiles@1.0.6/UGS-Files/clobby99.html', document.querySelector('.mode-btn'));
    </script>
</body>
</html>
