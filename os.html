<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex OS</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #1a1a1c;
            --card-hover: #252528;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #00ff66;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        
        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            margin: 20px auto;
            padding: 10px 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 1px;
            font-size: 1.2rem;
        }
        .nav-right {
            display: flex;
            gap: 15px;
        }
        .nav-icon {
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: 0.2s;
            fill: var(--text-muted);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-icon.active, .nav-icon:hover {
            background-color: #2a2a2d;
            fill: var(--text-main);
        }
        
        /* Search */
        .search-container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }
        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid #333;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        .search-bar:focus {
            border-color: var(--accent);
        }
        
        /* Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
        }
        .item-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-align: center;
            height: 140px;
        }
        .item-card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover);
        }
        .item-card img {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        .item-card span {
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        /* Custom GTA VI Icon */
        .gta-icon {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ff007f, #ffaa00);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Impact, sans-serif;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }
        .gta-top { font-size: 16px; line-height: 1; }
        .gta-num { font-size: 28px; line-height: 1; }
        
        /* Bottom Status Bar */
        .bottom-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--card-bg);
            padding: 10px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            max-width: 800px;
            box-sizing: border-box;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="nav-left">
            🦖 VERTEX
        </div>
        <div class="nav-right">
            <div class="nav-icon active" id="btn-games" onclick="switchTab('games')" title="Games">
                <!-- Gamepad Icon -->
                <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5S18.67 9 19.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            </div>
            <div class="nav-icon" id="btn-apps" onclick="switchTab('apps')" title="Apps">
                <!-- Grid Icon -->
                <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
            </div>
            <div class="nav-icon" title="Add App">
                <!-- Plus Icon -->
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </div>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
        <input type="text" class="search-bar" id="searchInput" placeholder="Search games or apps..." onkeyup="filterItems()">
    </div>

    <!-- Grid -->
    <div class="grid-container" id="grid">
        
        <!-- ================= GAMES TAB ================= -->
        
        <div class="item-card" data-category="games" onclick="openApp('./eaglercraft.html')">
            <img src="./eaglercraftL.jpg" alt="EaglerCraft" style="object-fit: contain; border-radius: 0;">
            <span>EaglerCraft</span>
        </div>

        <div class="item-card" data-category="games" onclick="openApp('./BuildNow.html')">
            <img src="https://play-lh.googleusercontent.com/Jkx-IPLeRDk4uKeDyIMWKQ6jv9RquAC0WErGzWIMZQK7Z8FKzsqbUtC0J7vTm24xIqnme3TZR-6a8WAj6EXP_DA=s256-rw" alt="BuildNow">
            <span>BuildNow GG</span>
        </div>

        <div class="item-card" data-category="games" onclick="openApp('./peopleplayground.html')">
            <img src="./ppg-logo.jpg" alt="People Playground">
            <span>People<br>Playground</span>
        </div>

        <div class="item-card" data-category="games" onclick="openApp('./gta.html')">
            <img src="./gtaL.jpg" alt="GTA" style="object-fit: contain; border-radius: 0;">
            <span>GTA 1</span>
        </div>

        <div class="item-card" data-category="games" onclick="openApp('./GTAVI.html')">
            <div class="gta-icon">
                <span class="gta-top">GTA</span>
                <span class="gta-num">VI</span>
            </div>
            <span>GTA VI</span>
        </div>

        <!-- ================= APPS TAB ================= -->
        
        <div class="item-card" data-category="apps" style="display: none;" onclick="openApp('./TikTok.html')">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" style="filter: invert(1); object-fit: contain; border-radius: 0;" alt="TikTok">
            <span>TikTok</span>
        </div>

    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <div class="status-text">
            <span class="status-dot"></span> online users: 688
        </div>
        <div style="display: flex; gap: 15px;">
            <!-- Settings Icon -->
            <svg width="18" height="18" fill="var(--text-muted)" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
            <!-- External Link Icon -->
            <svg width="18" height="18" fill="var(--text-muted)" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        </div>
    </div>

   <script>
        // Tab switching logic
        function switchTab(tabName) {
            const gamesBtn = document.getElementById('btn-games');
            const appsBtn = document.getElementById('btn-apps');
            const cards = document.querySelectorAll('.item-card');

            if (tabName === 'games') {
                gamesBtn.classList.add('active');
                appsBtn.classList.remove('active');
                cards.forEach(card => {
                    if (card.getAttribute('data-category') === 'games') card.style.display = 'flex';
                    else card.style.display = 'none';
                });
            } else {
                appsBtn.classList.add('active');
                gamesBtn.classList.remove('active');
                cards.forEach(card => {
                    if (card.getAttribute('data-category') === 'apps') card.style.display = 'flex';
                    else card.style.display = 'none';
                });
            }
            document.getElementById('searchInput').value = '';
        }

        // Search filtering logic
        function filterItems() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.item-card');
            const activeTab = document.getElementById('btn-games').classList.contains('active') ? 'games' : 'apps';

            cards.forEach(card => {
                const title = card.querySelector('span').innerText.toLowerCase();
                const category = card.getAttribute('data-category');
                
                if (category === activeTab) {
                    if (title.includes(input)) card.style.display = 'flex';
                    else card.style.display = 'none';
                }
            });
        }

        // Open app logic with the Restored Fullscreen & Hide buttons
        function openApp(url) {
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.backgroundColor = '#000';
            overlay.style.zIndex = '99999';

            const topBar = document.createElement('div');
            topBar.style.position = 'absolute';
            topBar.style.top = '0';
            topBar.style.left = '0';
            topBar.style.width = '100%';
            topBar.style.height = '40px';
            topBar.style.backgroundColor = '#1a1a1c';
            topBar.style.display = 'flex';
            topBar.style.alignItems = 'center';
            topBar.style.padding = '0 15px';
            topBar.style.boxSizing = 'border-box';
            topBar.style.gap = '10px';
            topBar.style.zIndex = '100000';
            topBar.style.borderBottom = '1px solid #333';

            const btnStyle = "background: #2a2a2d; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold;";

            // Back Button
            const backBtn = document.createElement('button');
            backBtn.innerHTML = '← Back';
            backBtn.style.cssText = btnStyle;
            backBtn.onclick = () => document.body.removeChild(overlay);

            // Hide Bar Button
            const hideBtn = document.createElement('button');
            hideBtn.innerHTML = '[ ] Hide Bar (No Esc Bug)';
            hideBtn.style.cssText = btnStyle;
            hideBtn.onclick = () => {
                topBar.style.display = 'none';
                iframe.style.paddingTop = '0';
            };

            // Fullscreen (Lock Esc) Button
            const fsBtn = document.createElement('button');
            fsBtn.innerHTML = '⛶ Fullscreen (Lock Esc)';
            fsBtn.style.cssText = btnStyle;
            fsBtn.onclick = async () => {
                try {
                    await overlay.requestFullscreen();
                    if (navigator.keyboard && navigator.keyboard.lock) {
                        await navigator.keyboard.lock(['Escape']);
                    }
                    topBar.style.display = 'none';
                    iframe.style.paddingTop = '0';
                } catch (e) {
                    console.log("Fullscreen Error:", e);
                }
            };

            topBar.appendChild(backBtn);
            topBar.appendChild(hideBtn);
            topBar.appendChild(fsBtn);

            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.style.paddingTop = '40px'; 
            iframe.style.boxSizing = 'border-box';

            // Bring bar back if they exit fullscreen normally
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    topBar.style.display = 'flex';
                    iframe.style.paddingTop = '40px';
                }
            });

            overlay.appendChild(topBar);
            overlay.appendChild(iframe);
            document.body.appendChild(overlay);
        }
    </script>
</body>
</html>
