<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GTA Advance</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #0b0b0c; overflow: hidden; }
    </style>
</head>
<body>
    <div style="width: 100%; height: 100%; max-width: 100%;">
        <div id="game"></div>
    </div>
    <script>
        EJS_player = '#game';
        EJS_core = 'gba'; 
        EJS_gameUrl = './gta.gba';
        
        // Bounces the engine request through jsDelivr's unblocked GitHub mirror
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
    </script>
    <script src="https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js"></script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
